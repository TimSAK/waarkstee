<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina niet gevonden | Waarkstee</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#241c15;--ink-soft:#5c5044;--paper:#fbf3e6;--clay:#c9552f;--clay-dark:#a5401f;--clay-soft:#f6ddce;--mustard:#e8a93d;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;}
  .card{background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:44px 36px;max-width:520px;width:100%;
    box-shadow:8px 9px 0 var(--ink);transform:rotate(-1deg);text-align:center;}
  .code{display:inline-block;background:var(--mustard);border:2.5px solid var(--ink);border-radius:999px;padding:6px 16px;
    font-weight:800;font-size:.85rem;box-shadow:3px 4px 0 var(--ink);transform:rotate(3deg);margin-bottom:18px;}
  h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.06;margin:0 0 .5em;font-weight:800;letter-spacing:-0.02em;}
  p{color:var(--ink-soft);margin:0 0 1.4em;}
  .btn{display:inline-flex;padding:14px 28px;border-radius:999px;font-weight:800;text-decoration:none;
    background:var(--clay);color:#fff5ea;box-shadow:5px 6px 0 var(--ink);border:2.5px solid transparent;transition:transform .18s ease,background .18s ease;}
  .btn:hover{background:var(--clay-dark);transform:translate(-2px,-3px) rotate(-1deg);}
</style>
</head>
<body>
  <div class="card">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="margin:0 auto 18px auto;display:block;"><rect x="8" y="5" width="48" height="55" rx="4" fill="#c9552f" stroke="#241c15" stroke-width="2.5"/><rect x="8" y="18" width="48" height="8" fill="#e8a93d" stroke="#241c15" stroke-width="2.5"/><rect x="14" y="38" width="24" height="18" rx="2" fill="#dde9ef" stroke="#241c15" stroke-width="2.5"/><rect x="44" y="39" width="8" height="17" rx="2" fill="#e8a93d" stroke="#241c15" stroke-width="2.5"/><rect x="17" y="47" width="18" height="3" rx="1.5" fill="#241c15"/><rect x="19" y="50" width="2.5" height="5" fill="#241c15"/><rect x="30.5" y="50" width="2.5" height="5" fill="#241c15"/><rect x="23" y="42" width="7" height="5" rx="1" fill="#241c15"/><rect x="15" y="9" width="8" height="6" rx="1" fill="#fbf3e6" stroke="#241c15" stroke-width="2"/><rect x="28" y="9" width="8" height="6" rx="1" fill="#fbf3e6" stroke="#241c15" stroke-width="2"/><rect x="41" y="9" width="8" height="6" rx="1" fill="#fbf3e6" stroke="#241c15" stroke-width="2"/><path d="M8 26 H56 L61 35 a4.85 3.6 0 0 1 -9.67 0 a4.85 3.6 0 0 1 -9.67 0 a4.85 3.6 0 0 1 -9.66 0 a4.85 3.6 0 0 1 -9.67 0 a4.85 3.6 0 0 1 -9.67 0 a4.85 3.6 0 0 1 -9.66 0 Z" fill="#fbf3e6" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><path d="M13.5 26 L10 34.5 M23 26 L21 34.5 M32.5 26 L32.5 34.5 M42 26 L44 34.5 M51.5 26 L55 34.5" stroke="#c9552f" stroke-width="3"/></svg>
    <div><span class="code">404</span></div>
    <h1>Dizze stee is der nait</h1>
    <p>Deze pagina bestaat niet (meer). Maar de werkplekken aan de Nieuweweg 16 wel.</p>
    <a class="btn home" href="/">Terug naar Waarkstee</a>
  </div>
  <script>
    // Op een GitHub Pages project-site (gebruiker.github.io/repo/) is de homepage niet "/" maar "/repo/".
    if (location.hostname.endsWith('github.io')) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.querySelector('a.home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
